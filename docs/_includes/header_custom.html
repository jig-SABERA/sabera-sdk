{%- comment -%}
  配色の切り替えボタン。実体は head_custom.html の link の media を差し替えるだけ。
{%- endcomment -%}
<button type="button" id="sabera-scheme-toggle" class="scheme-toggle"></button>
<script>
  (function () {
    var link = document.getElementById('sabera-dark-scheme');
    var button = document.getElementById('sabera-scheme-toggle');
    var LABEL = { light: 'ライト', dark: 'ダーク' };
    var ICON = {
      light:
        '<svg viewBox="0 0 16 16" aria-hidden="true">' +
        '<circle cx="8" cy="8" r="3.2" fill="currentColor"/>' +
        '<path d="M8 0.5v2M8 13.5v2M0.5 8h2M13.5 8h2M2.7 2.7l1.4 1.4M11.9 11.9l1.4 1.4M13.3 2.7l-1.4 1.4M4.1 11.9l-1.4 1.4"' +
        ' fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      dark:
        '<svg viewBox="0 0 16 16" aria-hidden="true">' +
        '<path d="M14 10.2A6.4 6.4 0 0 1 5.8 2a6.5 6.5 0 1 0 8.2 8.2z" fill="currentColor"/></svg>',
    };

    function current() {
      if (link.media === 'all') return 'dark';
      if (link.media === 'not all') return 'light';
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function render() {
      var next = current() === 'dark' ? 'light' : 'dark';
      button.innerHTML = ICON[next] + '<span>' + LABEL[next] + '</span>';
      button.setAttribute('aria-label', LABEL[next] + 'に切り替える');
    }

    button.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      link.media = next === 'dark' ? 'all' : 'not all';
      localStorage.setItem('sabera-color-scheme', next);
      render();
    });

    render();
  })();
</script>
