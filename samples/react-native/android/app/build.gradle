apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "jp.jig.glasses.sample.reactnative"
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-prerelease-check"]
    }

    defaultConfig {
        applicationId "jp.jig.sabera.app.sample.reactnative"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
    implementation("com.facebook.react:hermes-android:${rootProject.ext.reactNativeVersion}")

    // Sabera App SDK
    implementation("jp.jig.sabera.app.sdk:sabera-app-core:0.0.4")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
}
