name: Docs

# paths で絞ると SDK のバージョンを上げる PR などで回らず、落ちるのが main に入ってから
# になる。ジョブは数分で終わるので、すべての PR と main への push で回す。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: コード例をコンパイルする
        working-directory: samples/kmp
        run: ./gradlew --no-daemon :snippets:compileDebugKotlin :snippets:ktlintCheck

      - name: docs のコード例が最新か確かめる
        run: python3 scripts/sync-snippets.py --check

  published-sdk:
    name: Published SDK / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            tasks: ':shared:compileDebugKotlinAndroid'
          - platform: iOS
            os: macos-26
            tasks: ':shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0'

      # クリーンな checkout で公開版を検証する。ローカル SDK に差し替えると
      # AAR / KLIB の欠落や公開 API の不整合を検出できない。
      - name: 公開 SDK で shared をビルドする
        working-directory: samples/kmp
        run: |
          test -z "${SABERA_SDK_PATH:-}"
          test ! -f local.properties
          ./gradlew --no-daemon ${{ matrix.tasks }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: docs
          bundler-cache: true

      - name: サイトがビルドできることを確かめる
        working-directory: docs
        run: bundle exec jekyll build --trace

  # sdk.sabera.glass のドキュメントは S3 に置いて CloudFront で配る
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [snippets, published-sdk, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: docs
          bundler-cache: true

      - name: サイトをビルドする
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DOCS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: S3 に反映する
        run: aws s3 sync docs/_site "s3://${{ vars.DOCS_BUCKET }}/docs/" --delete

      - name: CloudFront のキャッシュを消す
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DOCS_DISTRIBUTION_ID }}" --paths '/*'
